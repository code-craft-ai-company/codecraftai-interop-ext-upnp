[tool.poetry]
name = "automojo-interop-ext-upnp"
description = "Automation Mojo - Upnp InterOp Extensions"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
automojo-interop = { git = "https://github.com/automationmojo/automojo-interop.git", branch = "main" }
automojo-landscaping = { git = "https://github.com/automationmojo/automojo-landscaping.git", branch = "main" }
automojo-this-app = { git = "https://github.com/automationmojo/automojo-this-app.git", branch = "main" }

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
